<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3E7030" />
    <title>جذور — غير متصل</title>
    <style>
      :root {
        --olive: #3e7030;
        --cream: #f7f3ed;
        --stone: #5c5346;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: radial-gradient(ellipse at top, #e8efe4 0%, var(--cream) 55%);
        color: var(--stone);
        text-align: center;
      }
      .card {
        max-width: 22rem;
        padding: 2rem 1.5rem;
        border-radius: 1.25rem;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(62, 112, 48, 0.2);
        box-shadow: 0 10px 30px rgba(62, 112, 48, 0.08);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        color: var(--olive);
      }
      p { margin: 0 0 1.25rem; line-height: 1.6; font-size: 0.95rem; }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 0.7rem 1.4rem;
        background: var(--olive);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      .en { opacity: 0.85; font-size: 0.85rem; margin-top: 0.75rem; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>لا يوجد اتصال</h1>
      <p>أنت غير متصل بالإنترنت الآن. تحقق من الشبكة ثم حاول مرة أخرى.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
      <p class="en">You are offline. Check your connection and try again.</p>
    </main>
  </body>
</html>
